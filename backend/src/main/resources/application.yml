server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: aircraft-mro
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aircraft_mro}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:admin}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 模块七落实证据文件上传
  multipart:
    max-file-size: 20MB
    max-request-size: 25MB

# 模块七：证据文件落盘目录（容器内 /data，前端通过 /api/ad/evidence-file/{id}/download 回读）
mro:
  ad:
    upload-dir: ${AD_EVIDENCE_DIR:/data/ad-evidence}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
